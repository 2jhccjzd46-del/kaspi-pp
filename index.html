<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Kaspi</title>
    <style>
        :root {
            --kaspi-red: #E41E31;
            --kaspi-gray: #F4F5F7;
            --text-dark: #1A1A1A;
            --text-gray: #7A7A7A;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--white); color: var(--text-dark); overflow: hidden; height: 100vh; width: 100vw; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white); display: none; flex-direction: column;
            overflow-y: auto; z-index: 1;
        }
        .screen.active { display: flex; }

        /* Картинка-шапка (не перекрывает контент) */
        .top-image {
            width: 100%;
            height: auto;
            display: block;
            flex-shrink: 0;
        }

        /* Контент под картинкой */
        .content {
            padding: 15px 20px 100px 20px; /* Отступ снизу для нижнего меню */
            flex-grow: 1;
        }

        /* Пин-код (особый случай — тут картинка на весь экран, но кнопки поверх прозрачные) */
        #pin-screen { 
            position: relative;
            justify-content: center; 
            align-items: center; 
            background: var(--white); 
            z-index: 100; 
        }
        #pin-screen .bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; opacity: 0.3;
        }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; position: relative; z-index: 20; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--kaspi-red); background: rgba(255,255,255,0.8); }
        .pin-dot.filled { background: var(--kaspi-red); }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; position: relative; z-index: 20; }
        .pin-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: rgba(244, 245, 247, 0.95); font-size: 24px; font-weight: 500;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .pin-btn:active { background: #ddd; }

        /* Общие стили */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .header h1 { font-size: 20px; }
        .back-btn { font-size: 24px; cursor: pointer; padding: 5px; }
        
        .btn {
            background: var(--kaspi-red); color: white; border: none;
            padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600;
            width: 100%; cursor: pointer; margin-top: 10px;
        }
        .btn:active { opacity: 0.8; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: var(--text-gray); margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
            background: var(--white);
        }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.98); border-top: 1px solid #eee;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 50;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-gray); cursor: pointer; }
        .nav-item.active { color: var(--kaspi-red); }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        .doc-tabs { display: flex; margin: 15px 20px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; }
        .doc-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: var(--white); }
        .doc-tab.active { background: var(--kaspi-red); color: white; }

        .file-upload {
            margin: 15px 0; padding: 20px; border: 2px dashed #ddd; border-radius: 10px;
            text-align: center; color: var(--text-gray); cursor: pointer; background: var(--white);
        }
        .file-upload input { display: none; }
        .file-preview { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 8px; }

        .contact-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; background: var(--white); }
        .contact-item:active { background: #f9f9f9; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПИН-КОД -->
    <div id="pin-screen" class="screen active">
        <img src="IMG_9364.jpeg" class="bg-image" alt="Pin Background" onerror="this.style.display='none'">
        
        <div style="position: relative; z-index: 20; display: flex; flex-direction: column; align-items: center;">
            <div class="pin-dots">
                <div class="pin-dot" id="dot1"></div><div class="pin-dot" id="dot2"></div>
                <div class="pin-dot" id="dot3"></div><div class="pin-dot" id="dot4"></div>
            </div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="enterPin(1)">1</button>
                <button class="pin-btn" onclick="enterPin(2)">2</button>
                <button class="pin-btn" onclick="enterPin(3)">3</button>
                <button class="pin-btn" onclick="enterPin(4)">4</button>
                <button class="pin-btn" onclick="enterPin(5)">5</button>
                <button class="pin-btn" onclick="enterPin(6)">6</button>
                <button class="pin-btn" onclick="enterPin(7)">7</button>
                <button class="pin-btn" onclick="enterPin(8)">8</button>
                <button class="pin-btn" onclick="enterPin(9)">9</button>
                <button class="pin-btn" onclick="clearPin()">X</button>
                <button class="pin-btn" onclick="enterPin(0)">0</button>
                <button class="pin-btn" onclick="deletePin()">⌫</button>
            </div>
            <p style="margin-top: 20px; color: #999; font-size: 14px; background: white; padding: 5px 10px; border-radius: 5px;">Введите код (8514)</p>
        </div>
    </div>

    <!-- ЭКРАН 2: ГЛАВНОЕ МЕНЮ -->
    <div id="main-screen" class="screen">
        <!-- Картинка сверху -->
        <img src="IMG_9326.png" class="top-image" alt="Main Menu" onerror="this.style.display='none'">
        
        <!-- Контент под картинкой -->
        <div class="content">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button class="btn" style="width: 30%;" onclick="showScreen('my-bank-screen')">Мой Банк</button>
                <button class="btn" style="width: 30%;" onclick="showScreen('transfers-screen')">Переводы</button>
                <button class="btn" style="width: 30%;" onclick="showGovServices()">Госуслуги</button>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="bottom-nav">
            <div class="nav-item active"><span>🏠</span> Главная</div>
            <div class="nav-item"><span>📷</span> QR</div>
            <div class="nav-item"><span>💬</span> Сообщения</div>
            <div class="nav-item"><span>⚙️</span> Сервисы</div>
        </div>
    </div>

    <!-- ЭКРАН 3: МОЙ БАНК -->
    <div id="my-bank-screen" class="screen">
        <img src="IMG_9354.jpeg" class="top-image" alt="Bank" onerror="this.style.display='none'">
        
        <div class="content">
            <div class="header" style="padding: 10px 0;">
                <div class="back-btn" onclick="showScreen('main-screen')">←</div>
                <h1>Мой Банк</h1>
                <div></div>
            </div>
            
            <div class="input-group">
                <label>Изменить сумму на счете</label>
                <input type="number" id="input-amount" placeholder="Например: 50000" oninput="updateBalance(this.value)">
            </div>
            <div class="input-group">
                <label>Имя владельца</label>
                <input type="text" id="input-name" placeholder="Введите имя">
            </div>
            <button class="btn" onclick="showScreen('main-screen')">Назад</button>
        </div>
    </div>

    <!-- ЭКРАН 5-6: ГОСУСЛУГИ -->
    <div id="gov-loading" class="screen" style="justify-content: center; align-items: center;">
        <img src="IMG_9356.webp" class="bg-image" alt="Gov Load" onerror="this.style.display='none'">
        <div style="position: relative; z-index: 20;">
            <h2>eGov + Kaspi</h2>
            <p style="color: #999; margin-top: 10px;">Загрузка...</p>
        </div>
    </div>

    <div id="gov-menu-screen" class="screen">
        <img src="IMG_9357.webp" class="top-image" alt="Gov Menu" onerror="this.style.display='none'">
        
        <div class="content">
            <div class="header" style="padding: 10px 0;">
                <div class="back-btn" onclick="showScreen('main-screen')">←</div>
                <h1>Госуслуги</h1>
                <div></div>
            </div>
            <button class="btn" onclick="showScreen('gov-id-screen')">Удостоверение личности</button>
        </div>
    </div>

    <!-- ЭКРАН 7-8: УДОСТОВЕРЕНИЕ -->
    <div id="gov-id-screen" class="screen">
        <!-- Картинка зависит от вкладки, меняется через JS -->
        <img src="IMG_9358.jpeg" class="top-image" id="id-bg" alt="ID" onerror="this.style.display='none'">
        
        <div class="content">
            <div class="header" style="padding: 10px 0;">
                <div class="back-btn" onclick="showScreen('gov-menu-screen')">←</div>
                <h1>Удостоверение</h1>
                <div></div>
            </div>
            
            <div class="doc-tabs">
                <div class="doc-tab active" onclick="switchTab('doc', event)">Документ</div>
                <div class="doc-tab" onclick="switchTab('req', event)">Реквизиты</div>
            </div>

            <div id="tab-doc">
                <div class="file-upload" onclick="document.getElementById('file-input').click()">
                    <span id="file-label">Выбрать файл</span>
                    <input type="file" id="file-input" accept="image/*" onchange="previewFile(event)">
                    <img id="file-preview" class="file-preview hidden" src="" alt="Превью">
                </div>
                <button class="btn" onclick="alert('Документ предъявлен!')">Предъявить документ</button>
            </div>

            <div id="tab-req" class="hidden">
                <div class="input-group"><label>ИИН</label><input type="text" placeholder="Введите ИИН"></div>
                <div class="input-group"><label>Номер паспорта</label><input type="text" placeholder="Введите номер"></div>
                <div class="input-group"><label>Дата рождения</label><input type="date"></div>
                <div class="input-group"><label>Дата выдачи</label><input type="date"></div>
                <div class="input-group"><label>Срок действия</label><input type="date"></div>
                <button class="btn" onclick="alert('Сохранено!')">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 9-11: ПЕРЕВОДЫ -->
    <div id="transfers-screen" class="screen">
        <img src="IMG_9360.jpeg" class="top-image" id="trans-bg" alt="Transfers" onerror="this.style.display='none'">
        
        <div class="content">
            <div class="header" style="padding: 10px 0;">
                <div class="back-btn" onclick="showScreen('main-screen')">←</div>
                <h1>Переводы</h1>
                <div></div>
            </div>
            
            <div class="doc-tabs">
                <div class="doc-tab active" onclick="switchTransferTab('new', event)">Новый перевод</div>
                <div class="doc-tab" onclick="switchTransferTab('history', event)">История</div>
            </div>

            <div id="transfer-new">
                <div class="input-group">
                    <label>Номер телефона или имя</label>
                    <input type="text" id="search-contact" placeholder="Введите имя" oninput="searchContacts()">
                </div>
                <div id="contacts-list" style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px;">
                    <div class="contact-item" onclick="selectContact('Айдар')">Айдар</div>
                    <div class="contact-item" onclick="selectContact('Мария')">Мария</div>
                    <div class="contact-item" onclick="selectContact('Ерлан')">Ерлан</div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Сумма</label>
                    <input type="number" id="transfer-amount" placeholder="0 ₸">
                </div>
                <button class="btn" onclick="makeTransfer()">Перевести</button>
            </div>

            <div id="transfer-history" class="hidden">
                <div class="input-group"><label>Дата</label><input type="date"></div>
                <div class="input-group"><label>Сумма</label><input type="number" placeholder="0 ₸"></div>
                <div class="input-group"><label>Имя получателя</label><input type="text" placeholder="Имя"></div>
                <div class="file-upload" onclick="document.getElementById('history-file').click()">
                    <span>Загрузить чек</span>
                    <input type="file" id="history-file" accept="image/*">
                </div>
                <div class="history-item" style="display:flex; justify-content:space-between; padding: 15px 0; border-bottom: 1px solid #eee;">
                    <div><strong>Kaspi Gold</strong><br><small style="color:#999;">Клиенту Kaspi</small></div>
                    <div style="color: var(--kaspi-red); font-weight: bold;">200,00 ₸</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPin = "";
        const correctPin = "8514";
        
        function enterPin(num) {
            if (currentPin.length < 4) currentPin += num;
            updateDots();
            if (currentPin.length === 4) checkPin();
        }
        function deletePin() { if (currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updateDots(); } }
        function clearPin() { currentPin = ""; updateDots(); }
        function updateDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentPin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            }
        }
        function checkPin() {
            if (currentPin === correctPin) {
                showScreen('main-screen'); currentPin = ""; updateDots();
            } else {
                alert("Неверный пин-код! (8514)"); clearPin();
            }
        }
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        function updateBalance(val) {}
        
        function showGovServices() {
            showScreen('gov-loading');
            setTimeout(() => { showScreen('gov-menu-screen'); }, 1500);
        }
        
        function switchTab(tab, event) {
            document.querySelectorAll('#gov-id-screen .doc-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const bg = document.getElementById('id-bg');
            
            if (tab === 'doc') {
                document.getElementById('tab-doc').classList.remove('hidden');
                document.getElementById('tab-req').classList.add('hidden');
                if(bg) bg.src = 'IMG_9358.jpeg';
            } else {
                document.getElementById('tab-doc').classList.add('hidden');
                document.getElementById('tab-req').classList.remove('hidden');
                if(bg) bg.src = 'IMG_9359.jpeg';
            }
        }
        
        function previewFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('file-preview').src = e.target.result;
                    document.getElementById('file-preview').classList.remove('hidden');
                    document.getElementById('file-label').innerText = "Файл выбран";
                }
                reader.readAsDataURL(file);
            }
        }
        
        function switchTransferTab(tab, event) {
            document.querySelectorAll('#transfers-screen .doc-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const bg = document.getElementById('trans-bg');
            
            if (tab === 'new') {
                document.getElementById('transfer-new').classList.remove('hidden');
                document.getElementById('transfer-history').classList.add('hidden');
                if(bg) bg.src = 'IMG_9361.jpeg';
            } else {
                document.getElementById('transfer-new').classList.add('hidden');
                document.getElementById('transfer-history').classList.remove('hidden');
                if(bg) bg.src = 'IMG_9363.png';
            }
        }
        
        function searchContacts() {
            const query = document.getElementById('search-contact').value.toLowerCase();
            document.querySelectorAll('#contacts-list .contact-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }
        function selectContact(name) {
            document.getElementById('search-contact').value = name;
            document.getElementById('contacts-list').style.display = 'none';
        }
        function makeTransfer() {
            alert("Перевод выполнен!");
        }
    </script>
</body>
</html>
