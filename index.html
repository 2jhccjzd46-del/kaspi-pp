<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Kaspi</title>
    <style>
        :root {
            --kaspi-red: #E41E31;
            --kaspi-gray: #F4F5F7;
            --text-dark: #1A1A1A;
            --text-gray: #7A7A7A;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--white); color: var(--text-dark); overflow: hidden; height: 100vh; width: 100vw; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white); display: none; flex-direction: column;
            overflow-y: auto; z-index: 1;
        }
        .screen.active { display: flex; }

        /* Картинка на весь экран */
        .full-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Невидимые зоны нажатия (поверх картинки) */
        .click-zone {
            position: absolute;
            background: transparent;
            z-index: 100;
            cursor: pointer;
            /* border: 1px solid red;  <- временно, чтобы видеть зоны. Потом уберём */
        }

        /* Пин-код (особый случай — кнопки реальные) */
        #pin-screen .pin-pad { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; z-index: 200; 
        }
        .pin-dots { display: flex; gap: 15px; position: absolute; top: 30%; left: 50%; transform: translateX(-50%); z-index: 200; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--kaspi-red); background: rgba(255,255,255,0.8); }
        .pin-dot.filled { background: var(--kaspi-red); }
        .pin-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: rgba(244, 245, 247, 0.9); font-size: 24px; font-weight: 500;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .pin-btn:active { background: #ddd; }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.95); border-top: 1px solid #eee;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 150;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-gray); cursor: pointer; }
        .nav-item.active { color: var(--kaspi-red); }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        /* Формы (только для экранов с вводом) */
        .form-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; padding: 20px; display: flex; flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
        }
        .header { padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .back-btn { font-size: 24px; cursor: pointer; padding: 5px; }
        
        .btn {
            background: var(--kaspi-red); color: white; border: none;
            padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600;
            width: 100%; cursor: pointer; margin-top: 10px;
        }
        .btn:active { opacity: 0.8; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: var(--text-gray); margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }

        .doc-tabs { display: flex; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .doc-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: var(--white); }
        .doc-tab.active { background: var(--kaspi-red); color: white; }

        .file-upload {
            margin: 15px 0; padding: 20px; border: 2px dashed #ddd; border-radius: 10px;
            text-align: center; color: var(--text-gray); cursor: pointer; background: var(--white);
        }
        .file-upload input { display: none; }
        .file-preview { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 8px; }

        .history-item {
            display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;
        }
        .history-item .info { display: flex; flex-direction: column; }
        .history-item .info span:first-child { font-weight: 600; }
        .history-item .info span:last-child { font-size: 12px; color: var(--text-gray); }
        .history-item .amount { font-weight: 600; color: var(--kaspi-red); }

        .hidden { display: none !important; }
        .contact-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; background: white; }
        .contact-item:active { background: #f9f9f9; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПИН-КОД (кнопки реальные) -->
    <div id="pin-screen" class="screen active">
        <img src="IMG_9364.jpeg" class="full-image" alt="Pin" onerror="this.style.display='none'">
        <div class="pin-dots">
            <div class="pin-dot" id="dot1"></div><div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div><div class="pin-dot" id="dot4"></div>
        </div>
        <div class="pin-pad">
            <button class="pin-btn" onclick="enterPin(1)">1</button>
            <button class="pin-btn" onclick="enterPin(2)">2</button>
            <button class="pin-btn" onclick="enterPin(3)">3</button>
            <button class="pin-btn" onclick="enterPin(4)">4</button>
            <button class="pin-btn" onclick="enterPin(5)">5</button>
            <button class="pin-btn" onclick="enterPin(6)">6</button>
            <button class="pin-btn" onclick="enterPin(7)">7</button>
            <button class="pin-btn" onclick="enterPin(8)">8</button>
            <button class="pin-btn" onclick="enterPin(9)">9</button>
            <button class="pin-btn" onclick="clearPin()">X</button>
            <button class="pin-btn" onclick="enterPin(0)">0</button>
            <button class="pin-btn" onclick="deletePin()">⌫</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ГЛАВНОЕ МЕНЮ (невидимые зоны) -->
    <div id="main-screen" class="screen">
        <img src="IMG_9326.png" class="full-image" alt="Main" onerror="this.style.display='none'">
        
        <!-- Невидимые зоны нажатия. Координаты подобраны под скрин IMG_9326 -->
        <!-- Мой Банк (первая иконка сверху) -->
        <div class="click-zone" style="top: 30%; left: 5%; width: 22%; height: 8%;" onclick="showScreen('my-bank-screen')"></div>
        <!-- Переводы (вторая иконка сверху) -->
        <div class="click-zone" style="top: 30%; left: 28%; width: 22%; height: 8%;" onclick="showScreen('transfers-screen')"></div>
        <!-- Госуслуги (третья иконка сверху) -->
        <div class="click-zone" style="top: 30%; left: 51%; width: 22%; height: 8%;" onclick="showGovServices()"></div>

        <!-- Нижнее меню -->
        <div class="bottom-nav">
            <div class="nav-item active"><span>🏠</span> Главная</div>
            <div class="nav-item"><span>📷</span> QR</div>
            <div class="nav-item"><span>💬</span> Сообщения</div>
            <div class="nav-item"><span>⚙️</span> Сервисы</div>
        </div>
    </div>

    <!-- ЭКРАН 3-4: МОЙ БАНК (форма, потому что нужен ввод) -->
    <div id="my-bank-screen" class="screen">
        <img src="IMG_9354.jpeg" class="full-image" alt="Bank" onerror="this.style.display='none'">
        <div class="form-layer" style="background: rgba(255,255,255,0.95);">
            <div class="header"><div class="back-btn" onclick="showScreen('main-screen')">←</div><h1>Мой Банк</h1><div></div></div>
            
            <div class="input-group">
                <label>Изменить сумму на счете</label>
                <input type="number" id="input-amount" placeholder="Например: 50000">
            </div>
            <div class="input-group">
                <label>Имя владельца</label>
                <input type="text" id="input-name" placeholder="Введите имя">
            </div>
            <button class="btn" onclick="showScreen('main-screen')">Назад</button>
        </div>
    </div>

    <!-- ЭКРАН 5-6: ГОСУСЛУГИ -->
    <div id="gov-loading" class="screen" style="justify-content: center; align-items: center;">
        <img src="IMG_9356.webp" class="full-image" alt="Gov Load" onerror="this.style.display='none'">
        <h2 style="position: relative; z-index: 200;">eGov + Kaspi</h2>
    </div>

    <div id="gov-menu-screen" class="screen">
        <img src="IMG_9357.webp" class="full-image" alt="Gov Menu" onerror="this.style.display='none'">
        <!-- Невидимая зона для кнопки "Удостоверение личности" -->
        <div class="click-zone" style="top: 33%; left: 5%; width: 30%; height: 15%;" onclick="showScreen('gov-id-screen')"></div>
        <!-- Выход назад -->
        <div class="click-zone" style="top: 2%; left: 2%; width: 10%; height: 6%;" onclick="showScreen('main-screen')"></div>
    </div>

    <!-- ЭКРАН 7-8: УДОСТОВЕРЕНИЕ -->
    <div id="gov-id-screen" class="screen">
        <img src="IMG_9358.jpeg" class="full-image" id="id-bg" alt="ID" onerror="this.style.display='none'">
        
        <!-- Вкладки -->
        <div style="position: absolute; top: 12%; width: 100%; z-index: 200; display: flex; padding: 0 20px;">
            <div style="flex:1; text-align: center; cursor: pointer;" onclick="switchTab('doc', event)">Документ</div>
            <div style="flex:1; text-align: center; cursor: pointer;" onclick="switchTab('req', event)">Реквизиты</div>
        </div>
        
        <!-- Кнопка "Назад" -->
        <div class="click-zone" style="top: 2%; left: 2%; width: 10%; height: 6%;" onclick="showScreen('gov-menu-screen')"></div>
    </div>

    <!-- ЭКРАН 9-11: ПЕРЕВОДЫ -->
    <div id="transfers-screen" class="screen">
        <img src="IMG_9360.jpeg" class="full-image" id="trans-bg" alt="Transfers" onerror="this.style.display='none'">
        
        <!-- Вкладки -->
        <div style="position: absolute; top: 12%; width: 100%; z-index: 200; display: flex; padding: 0 20px;">
            <div style="flex:1; text-align: center; cursor: pointer;" onclick="switchTransferTab('new', event)">Новый перевод</div>
            <div style="flex:1; text-align: center; cursor: pointer;" onclick="switchTransferTab('history', event)">История</div>
        </div>

        <!-- Кнопка "Назад" -->
        <div class="click-zone" style="top: 2%; left: 2%; width: 10%; height: 6%;" onclick="showScreen('main-screen')"></div>

        <!-- Для "Нового перевода" – невидимая зона на "Клиенту Kaspi" -->
        <div id="zone-new-transfer" class="click-zone" style="top: 30%; left: 0; width: 100%; height: 10%;" onclick="alert('Перевод клиенту Kaspi (заглушка)')"></div>
    </div>

    <script>
        let currentPin = "";
        const correctPin = "8514";
        
        function enterPin(num) {
            if (currentPin.length < 4) currentPin += num;
            updateDots();
            if (currentPin.length === 4) checkPin();
        }
        function deletePin() { if (currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updateDots(); } }
        function clearPin() { currentPin = ""; updateDots(); }
        function updateDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentPin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            }
        }
        function checkPin() {
            if (currentPin === correctPin) {
                showScreen('main-screen'); currentPin = ""; updateDots();
            } else {
                alert("Неверный пин-код! (8514)"); clearPin();
            }
        }
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        function showGovServices() {
            showScreen('gov-loading');
            setTimeout(() => { showScreen('gov-menu-screen'); }, 1500);
        }
        function switchTab(tab, event) {
            const bg = document.getElementById('id-bg');
            if (tab === 'doc') {
                if(bg) bg.src = 'IMG_9358.jpeg';
            } else {
                if(bg) bg.src = 'IMG_9359.jpeg';
            }
        }
        function switchTransferTab(tab, event) {
            const bg = document.getElementById('trans-bg');
            if (tab === 'new') {
                if(bg) bg.src = 'IMG_9361.jpeg';
            } else {
                if(bg) bg.src = 'IMG_9363.png';
            }
        }
    </script>
</body>
</html>
